name: Flutter-App – Android-Build (Phase 10)

# Analog zu ios-app.yml: manuell hinzuzufuegen, da das genutzte GitHub-PAT
# kein "workflow"-Scope hat und Dateien unter .github/workflows/ nicht
# selbst pushen kann. Einmalig manuell als .github/workflows/android-app.yml
# im Repo anlegen, danach laeuft alles Weitere automatisch.
#
# Laeuft auf ubuntu-latest (guenstiger/schneller als macOS, Android-SDK ist
# auf den Standard-Ubuntu-Runnern bereits vorinstalliert). Die APK wird mit
# dem Debug-Key signiert (Standard-Flutter-Vorlage, siehe
# android/app/build.gradle.kts: "TODO: Add your own signing config for the
# release build" - fuer echtes Play-Store-Deployment spaeter durch ein
# eigenes Signing-Zertifikat zu ersetzen, fuer Sideloading auf Testgeraeten
# reicht das). Das fertige APK wird sowohl als Workflow-Artifact als auch
# als Asset an einem echten GitHub-Release angehaengt (der CI-Runner hat
# normalen Internetzugriff, im Gegensatz zur Cloud-Sandbox/Geraete-Bruecke,
# die den Artifact-/Log-Download blockiert bekommen - deshalb macht die CI
# selbst den Release, nicht ich im Nachhinein).

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/android-app.yml"

permissions:
  contents: write

jobs:
  flutter-android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Domain-Package (werkzeugkiste) als Pfad-Abhaengigkeit einbinden
        run: |
          cd app
          if ! grep -q "^  werkzeugkiste:" pubspec.yaml; then
            awk '/^dependencies:/{print; print "  werkzeugkiste:"; print "    path: .."; next}1' pubspec.yaml > pubspec.yaml.new
            mv pubspec.yaml.new pubspec.yaml
          fi

      - name: flutter pub get
        run: cd app && flutter pub get

      - name: Code-Generierung (Drift, ADR-07)
        run: cd app && dart run build_runner build --delete-conflicting-outputs

      - name: flutter build apk (release, debug-signiert)
        run: |
          cd app
          if ! flutter build apk --release > /tmp/build_android.log 2>&1; then
            tr -d '\r' < /tmp/build_android.log > /tmp/build_android.clean.log
            echo "::error::flutter build apk fehlgeschlagen:%0A$(tail -c 60000 /tmp/build_android.clean.log | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
            cat /tmp/build_android.log
            exit 1
          fi
          cat /tmp/build_android.log

      - name: Fehler-Log bei Fehlschlag ins Repo committen (Diagnose)
        if: failure()
        run: |
          mkdir -p ci-logs
          cp /tmp/build_android.log ci-logs/build_android.log 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ci-logs
          if ! git diff --cached --quiet; then
            git commit -m "CI-Diagnose: Android-Build-Log von Run ${{ github.run_id }} (${{ github.run_attempt }})"
            git push
          fi

      - name: APK als Workflow-Artifact hochladen
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: werkzeugkiste-app-release
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Release-Notes erzeugen
        if: success()
        run: |
          APP_VERSION=$(grep '^version:' app/pubspec.yaml | sed 's/version: *//')
          {
            echo "## Werkzeugkiste – Android-Testbuild"
            echo ""
            echo "Automatisch erzeugter CI-Build zum Sideloaden auf Android-Testgeraeten."
            echo "Kein Play-Store-Release, keine Produktions-Signatur."
            echo ""
            echo "**Version:** \`${APP_VERSION}\`  "
            echo "**Commit:** \`${{ github.sha }}\`  "
            echo "**Build:** #${{ github.run_number }} (Workflow-Run [${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}))  "
            echo "**Erstellt:** $(date -u +'%Y-%m-%d %H:%M UTC')"
            echo ""
            echo "### Was in diesem Build enthalten ist"
            echo ""
            echo "Vollstaendige lokale MVP-Umsetzung der Kern-Workflows aus dem Lastenheft (v0.4):"
            echo ""
            echo "- Onboarding mit lokaler Geraete-Identitaet"
            echo "- Community anlegen, per Einladungs-Token beitreten"
            echo "- Werkzeuge anlegen, bearbeiten, in der Community-Uebersicht anzeigen"
            echo "- Ausleihe anfragen, durch Eigentuemer annehmen, Rueckgabe bestaetigen"
            echo "- Vollstaendig lokale Persistenz (SQLite ueber Drift, ADR-07)"
            echo "- Foto-Ablage inhaltsadressiert per SHA-256-Hash (ADR-05)"
            echo ""
            echo "### Was bewusst NICHT enthalten ist"
            echo ""
            echo "- **Kein Geraete-Sync:** Es gibt noch keine Nostr-Relay-Anbindung (ADR-01/02/08)."
            echo "  Jede Installation hat ihre eigene lokale Datenbank; zwei Geraete tauschen"
            echo "  aktuell nichts miteinander aus. Interaktionen zwischen mehreren Personen"
            echo "  lassen sich damit noch nicht end-to-end testen."
            echo "- **Keine echte kryptographische Identitaet:** Der Geraete-Pubkey ist ein"
            echo "  zufaelliger Platzhalter, keine echten secp256k1/Nostr-Schluessel (ADR-06)."
            echo "- **Keine Datenbank-Verschluesselung:** SQLCipher ist als Ziel in ADR-07"
            echo "  dokumentiert, aber noch nicht umgesetzt."
            echo "- **Kein Produktions-Signing:** Diese APK ist mit Flutters Standard-Debug-Key"
            echo "  signiert (siehe \`android/app/build.gradle.kts\`), nicht fuer den Play Store."
            echo ""
            echo "### Installation (Sideloading)"
            echo ""
            echo "1. \`werkzeugkiste-app-release.apk\` unten unter Assets herunterladen."
            echo "2. Auf dem Android-Geraet \"Installation aus unbekannten Quellen\" fuer den"
            echo "   verwendeten Browser/Dateimanager erlauben (Einstellungen > Sicherheit, je"
            echo "   nach Android-Version)."
            echo "3. APK oeffnen und installieren."
            echo ""
            echo "### Technische Details"
            echo ""
            echo "- Flutter-Kanal: stable (subosito/flutter-action)"
            echo "- Build-Runner: ubuntu-latest, Java 17 (Temurin)"
            echo "- Domain-Paket \`werkzeugkiste\` als lokale Pfad-Abhaengigkeit eingebunden"
            echo "- State-Management: Riverpod; Persistenz: Drift/SQLite"
          } > /tmp/release_notes.md
          cat /tmp/release_notes.md

      - name: GitHub-Release erstellen (mit APK als Asset)
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: "Android-Testbuild #${{ github.run_number }}"
          body_path: /tmp/release_notes.md
          files: app/build/app/outputs/flutter-apk/app-release.apk
          prerelease: true
