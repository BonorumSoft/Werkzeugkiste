name: Flutter-App – Grundgerüst & iOS-Build (Phase 10)

# Warum diese Datei getrennt von cli.yml ist und manuell hinzugefügt werden
# muss: das für die Domain-Schicht genutzte GitHub-PAT hat aus Sicherheits-
# gruenden kein "workflow"-Scope, kann also keine Dateien unter
# .github/workflows/ selbst pushen. Bitte diese Datei einmalig manuell als
# .github/workflows/ios-app.yml im Repo anlegen (z. B. ueber die GitHub-
# Weboberflaeche) – alles Weitere (Scaffolding, Build, Commit des erzeugten
# Codes) laeuft danach automatisch ueber den regulaeren GITHUB_TOKEN dieses
# Workflow-Laufs, der dafuer kein Extra-Scope braucht, solange er nicht
# selbst .github/workflows/ aendert.
#
# Hintergrund: Die in der Cloud-Sandbox bzw. auf dem verbundenen Mac
# laufende Automatisierung kann kein echtes Flutter/Xcode-Toolchain
# bootstrappen (Dart-SDK-Download von storage.googleapis.com ist per
# Egress-Allowlist blockiert; Xcode selbst benoetigt echtes macOS, nicht
# die isolierte Linux-VM der Geraete-Bruecke). GitHub-Actions-Runner vom
# Typ macos-latest haben beides bereits vorinstalliert und uneingeschraenkten
# Netzwerkzugriff – deshalb laeuft das komplette Flutter/iOS-Scaffolding
# und der erste Kompilierbarkeits-Nachweis hier statt lokal.
#
# Hinweis zur Fehlerdiagnose: Sowohl die GitHub-Actions-Rohlogs (Redirect auf
# blob.core.windows.net) als auch ::error::-Annotationen mit \r-haltigem
# Flutter-Output (Fortschrittsanzeigen wie "Analyzing app...") sind fuer die
# automatisierte Diagnose unzuverlaessig/blockiert. Deshalb werden die
# Fehler-Logs bei einem Fehlschlag zusaetzlich direkt ins Repo committet
# (ci-logs/), das funktioniert ueber den normalen GITHUB_TOKEN dieses Laufs.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/ios-app.yml"

permissions:
  contents: write

jobs:
  flutter-ios-scaffold-and-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter-App-Grundgeruest erzeugen (nur falls noch nicht vorhanden)
        run: |
          if [ ! -d "app" ]; then
            flutter create \
              --org com.bonorumsoft \
              --project-name werkzeugkiste_app \
              --platforms=ios,android \
              app
          else
            echo "app/ existiert bereits – Scaffolding wird nicht erneut ausgefuehrt."
          fi

      - name: Domain-Package (werkzeugkiste) als Pfad-Abhaengigkeit einbinden
        run: |
          cd app
          if ! grep -q "^  werkzeugkiste:" pubspec.yaml; then
            awk '/^dependencies:/{print; print "  werkzeugkiste:"; print "    path: .."; next}1' pubspec.yaml > pubspec.yaml.new
            mv pubspec.yaml.new pubspec.yaml
          fi
          echo "--- app/pubspec.yaml (dependencies-Ausschnitt) ---"
          grep -A5 "^dependencies:" pubspec.yaml

      - name: flutter pub get
        run: cd app && flutter pub get

      - name: Code-Generierung (Drift, ADR-07)
        run: cd app && dart run build_runner build --delete-conflicting-outputs

      - name: flutter analyze
        run: |
          cd app
          if ! flutter analyze > /tmp/analyze.log 2>&1; then
            tr -d '\r' < /tmp/analyze.log > /tmp/analyze.clean.log
            echo "::error::flutter analyze fehlgeschlagen:%0A$(sed 's/%/%25/g' /tmp/analyze.clean.log | sed ':a;N;$!ba;s/\n/%0A/g')"
            cat /tmp/analyze.log
            exit 1
          fi
          cat /tmp/analyze.log

      - name: flutter test
        run: |
          cd app
          if ! flutter test > /tmp/test.log 2>&1; then
            tr -d '\r' < /tmp/test.log > /tmp/test.clean.log
            echo "::error::flutter test fehlgeschlagen:%0A$(sed 's/%/%25/g' /tmp/test.clean.log | sed ':a;N;$!ba;s/\n/%0A/g')"
            cat /tmp/test.log
            exit 1
          fi
          cat /tmp/test.log

      - name: iOS-Build ohne Codesigning (reiner Kompilierbarkeits-Nachweis)
        run: |
          cd app
          if ! flutter build ios --no-codesign > /tmp/build.log 2>&1; then
            tr -d '\r' < /tmp/build.log > /tmp/build.clean.log
            echo "::error::flutter build ios fehlgeschlagen:%0A$(tail -c 60000 /tmp/build.clean.log | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
            cat /tmp/build.log
            exit 1
          fi
          cat /tmp/build.log

      - name: Fehler-Logs bei Fehlschlag ins Repo committen (Diagnose)
        if: failure()
        run: |
          mkdir -p ci-logs
          cp /tmp/analyze.log ci-logs/analyze.log 2>/dev/null || true
          cp /tmp/test.log ci-logs/test.log 2>/dev/null || true
          cp /tmp/build.log ci-logs/build.log 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ci-logs
          if ! git diff --cached --quiet; then
            git commit -m "CI-Diagnose: Fehler-Logs von Run ${{ github.run_id }} (${{ github.run_attempt }})"
            git push
          else
            echo "Keine Log-Dateien zum Committen gefunden."
          fi

      - name: Erzeugtes Scaffold committen (nur wenn neu/geaendert)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app
          if ! git diff --cached --quiet; then
            git commit -m "Flutter-App-Grundgeruest automatisch erzeugt und iOS-Build verifiziert (CI, macos-latest)"
            git push
          else
            echo "Keine Aenderungen an app/ zu committen."
          fi
