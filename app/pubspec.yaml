name: werkzeugkiste_app
description: "Werkzeugkiste – Community-Werkzeug-Verleih-App (Flutter/iOS/Android)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  werkzeugkiste:
    path: ..
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Application-Schicht: State-Management (Lastenheft Abschnitt 35 nennt
  # Riverpod als Kandidaten).
  flutter_riverpod: ^2.6.1

  # Infrastructure-Schicht: lokale Datenbank (ADR-07, Drift/SQLite).
  drift: ^2.21.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # Infrastructure-Schicht: Foto-Hashing (ADR-05), Einladungs-Token (ADR-03),
  # ID-Erzeugung, sichere Ablage der lokalen Geräte-Identität (ADR-06/07).
  crypto: ^3.0.5
  uuid: ^4.5.1
  flutter_secure_storage: ^9.2.4

  # Kombiniert die Drift-Watch-Streams von CommunitiesTable/MembersTable zu
  # einem gemeinsamen reaktiven Community-Stream (siehe
  # infrastructure/repositories/community_repository.dart).
  async: ^2.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code-Generierung für Drift (siehe .github/workflows/iOS-app.yml: Schritt
  # "dart run build_runner build" vor analyze/test/build).
  drift_dev: ^2.21.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
