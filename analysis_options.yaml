include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    unused_import: error
    unused_local_variable: error
  exclude:
    # app/ ist ein eigenständiges Flutter-Package mit eigener pubspec.yaml
    # und eigenem CI-Job (.github/workflows/iOS-app.yml, "flutter analyze"
    # nach "flutter pub get" dort). Der Domain-CI-Job hier (cli.yml) führt
    # nur "dart pub get" im Repo-Root aus, ohne app/'s Abhängigkeiten
    # (flutter_riverpod, drift, ...) aufzulösen – ohne diesen Ausschluss
    # meldet "dart analyze" hier fälschlich "Target of URI doesn't exist"
    # für jeden app/-Import.
    - "app/**"

linter:
  rules:
    - prefer_const_constructors
    - prefer_final_fields
    - always_declare_return_types
    - avoid_dynamic_calls
